<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>날씨 예보 방송 (WeatherCast)</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; overflow: hidden; background-color: black; }
        .text-shadow { text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Lucide React 아이콘들을 독립적인 SVG 컴포넌트로 대체 ---
        const Icon = ({ children, size = 24, color = "currentColor", className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const Video = (props) => <Icon {...props}><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></Icon>;
        const Plus = (props) => <Icon {...props}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></Icon>;
        const Play = (props) => <Icon {...props} fill={props.fill || "none"}><polygon points="5 3 19 12 5 21 5 3"></polygon></Icon>;
        const ChevronRight = (props) => <Icon {...props}><polyline points="9 18 15 12 9 6"></polyline></Icon>;
        const Droplets = (props) => <Icon {...props}><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7 2.99 7 2.99s-2.29 6.08-2.29 6.08C3.57 10 3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6.6A10.97 10.97 0 0 1 14 8c2 2.5 2 4.5 2 4.5"/></Icon>;
        const Wind = (props) => <Icon {...props}><path d="M12.8 19.6A2 2 0 1 0 14 16H2"/><path d="M17.5 8a2.5 2.5 0 1 1 2 4H2"/><path d="M9.8 4.4A2 2 0 1 1 11 8H2"/></Icon>;
        const Compass = (props) => <Icon {...props}><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></Icon>;
        const Gauge = (props) => <Icon {...props}><path d="m12 14 4-4"/><path d="M3.34 16.66L2 18"/><path d="m22 18-1.34-1.34"/><path d="M22.7 10a10 10 0 1 0-15.39 10.14"/></Icon>;
        const CloudSun = (props) => <Icon {...props}><path d="M12 2v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="M20 12h2"/><path d="m19.07 4.93-1.41 1.41"/><path d="M15.947 12.65a4 4 0 0 0-5.925-4.128"/><path d="M3 20a5 5 0 1 1 8.9-4H13a3 3 0 0 1 2 5.24"/></Icon>;
        const CloudRain = (props) => <Icon {...props}><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/></Icon>;
        const CloudLightning = (props) => <Icon {...props}><path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9"/><path d="m13 11-4 6h6l-4 6"/></Icon>;
        const CloudSnow = (props) => <Icon {...props}><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M8 15h.01"/><path d="M8 19h.01"/><path d="M12 17h.01"/><path d="M12 21h.01"/><path d="M16 15h.01"/><path d="M16 19h.01"/></Icon>;
        const Sun = (props) => <Icon {...props}><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></Icon>;
        const Haze = (props) => <Icon {...props}><path d="M2 13h20"/><path d="M2 17h20"/><path d="M2 21h20"/><path d="M16 13a4 4 0 0 0-8 0"/><path d="m12 12-1.4-1.4"/></Icon>;

        const App = () => {
            const [step, setStep] = useState(1);
            const [newsName, setNewsName] = useState('');
            const [anchorName, setAnchorName] = useState('');
            const [weatherCasterName, setWeatherCasterName] = useState('');
            const [citizenNames, setCitizenNames] = useState(['']);
            const [currentCitizenIndex, setCurrentCitizenIndex] = useState(0);

            const [weatherType, setWeatherType] = useState('sunny');
            const [realtimeWeatherType, setRealtimeWeatherType] = useState('sunny'); // 실시간 날씨 데이터 상태
            const [isMediaPipeLoaded, setIsMediaPipeLoaded] = useState(false);

            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const cameraRef = useRef(null);
            const selfieSegmentationRef = useRef(null);
            const isProcessingRef = useRef(false);
            const [showTitle, setShowTitle] = useState(false);
            const [hasCameraPermission, setHasCameraPermission] = useState(false);
            const globalStreamRef = useRef(null); 

            // 날씨별 배경화면 맵
            const weatherBackgrounds = {
                sunny: 'https://github.com/sae6gnicky/weathercast/raw/main/sunny.png',
                cloudy: 'https://github.com/sae6gnicky/weathercast/raw/main/cloudy.png',
                rainy: 'https://github.com/sae6gnicky/weathercast/raw/main/rainy.png',
                snowy: 'https://github.com/sae6gnicky/weathercast/raw/main/snowy.png',
                windy: 'https://github.com/sae6gnicky/weathercast/raw/main/windy.png',
                dust: 'https://github.com/sae6gnicky/weathercast/raw/main/dust.png',
                hot: 'https://github.com/sae6gnicky/weathercast/raw/main/hot.png'
            };

            // 실시간 날씨 정보를 가져오는 Effect
            useEffect(() => {
                const fetchRealtimeWeather = async () => {
                    try {
                        // 서울 위경도 기준 날씨 정보 가져오기
                        const weatherRes = await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current_weather=true');
                        const weatherData = await weatherRes.json();
                        const code = weatherData.current_weather.weathercode;
                        const temp = weatherData.current_weather.temperature;
                        const wind = weatherData.current_weather.windspeed;

                        // 공기질 정보 가져오기 (실패 시 기본값 처리)
                        let pm10 = 0;
                        try {
                            const airRes = await fetch('https://air-quality-api.open-meteo.com/v1/air-quality?latitude=37.5665&longitude=126.9780&current=pm10');
                            const airData = await airRes.json();
                            pm10 = airData.current.pm10;
                        } catch(e) { console.warn("미세먼지 정보를 가져오는데 실패했습니다.", e); }

                        let type = 'sunny';
                        if (code === 0) type = 'sunny';
                        else if (code >= 1 && code <= 3) type = 'cloudy';
                        else if ([45, 48].includes(code)) type = 'cloudy'; // 안개
                        else if (code >= 51 && code <= 67) type = 'rainy';
                        else if (code >= 71 && code <= 86) type = 'snowy';
                        else if (code >= 95 && code <= 99) type = 'rainy'; // 뇌우

                        // 특보 기준 덮어쓰기 (우선순위: 미세먼지 < 바람 < 폭염)
                        if (pm10 > 80) type = 'dust'; 
                        if (wind >= 36) type = 'windy'; 
                        if (temp >= 33) type = 'hot'; 

                        setRealtimeWeatherType(type);
                    } catch (err) {
                        console.error('실시간 날씨 정보를 가져오는데 실패했습니다.', err);
                        setRealtimeWeatherType('sunny'); // 에러 시 기본 맑음 처리
                    }
                };
                fetchRealtimeWeather();
            }, []);

            // 날짜 및 텍스트 렌더링 헬퍼 함수
            const getDates = (type) => {
                let baseDateStr;
                if (type === 'realtime') {
                    const now = new Date();
                    baseDateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                } else {
                    const mappedDates = {
                        'sunny': '2026-05-05',
                        'cloudy': '2026-06-26',
                        'rainy': '2026-06-26',
                        'snowy': '2026-02-02',
                        'windy': '2025-10-23', // <--- 날짜 변경 부분
                        'dust': '2026-03-16',
                        'hot': '2026-08-08'
                    };
                    baseDateStr = mappedDates[type] || '2026-05-05';
                }
                const todayDate = new Date(baseDateStr);

                const yesterday = new Date(todayDate);
                yesterday.setDate(todayDate.getDate() - 1);
                const tomorrow = new Date(todayDate);
                tomorrow.setDate(todayDate.getDate() + 1);

                return {
                    yesterdayStr: `어제 (${yesterday.getMonth() + 1}/${yesterday.getDate()})`,
                    todayStr: `오늘 (${todayDate.getMonth() + 1}/${todayDate.getDate()})`,
                    tomorrowStr: `내일 (${tomorrow.getMonth() + 1}/${tomorrow.getDate()})`
                };
            };

            // 선택된 날씨에 따른 날씨 UI 데이터 헬퍼 함수 (어제, 오늘, 내일 분리)
            const getRenderWeatherData = () => {
                const type = weatherType === 'realtime' ? realtimeWeatherType : weatherType;
                const weatherForecasts = {
                    sunny: {
                        yesterday: { icon: CloudSun, mainTemp: '26°C', subTemp: '10°C' },
                        today: { icon: Sun, mainTemp: '27°C', subTemp: '11°C', bg: 'https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=600&q=80' },
                        tomorrow: { icon: Sun, mainTemp: '25°C', subTemp: '12°C' }
                    },
                    cloudy: {
                        yesterday: { icon: Sun, mainTemp: '28°C', subTemp: '19°C' },
                        today: { icon: CloudSun, mainTemp: '26°C', subTemp: '20°C', bg: 'https://images.unsplash.com/photo-1499956827185-0d63ee78a910?w=600&q=80' },
                        tomorrow: { icon: CloudRain, mainTemp: '24°C', subTemp: '18°C' }
                    },
                    rainy: {
                        yesterday: { icon: CloudSun, mainTemp: '29°C', subTemp: '21°C' },
                        today: { icon: CloudRain, mainTemp: '25°C', subTemp: '20°C', bg: 'https://images.unsplash.com/photo-1515694346937-94d85e41e6f0?w=600&q=80' },
                        tomorrow: { icon: CloudRain, mainTemp: '26°C', subTemp: '20°C' }
                    },
                    snowy: {
                        yesterday: { icon: CloudSun, mainTemp: '1°C', subTemp: '-7°C' },
                        today: { icon: CloudSnow, mainTemp: '-2°C', subTemp: '-10°C', bg: 'https://images.unsplash.com/photo-1542601098-3adb3baeb1ec?w=600&q=80' },
                        tomorrow: { icon: Sun, mainTemp: '0°C', subTemp: '-8°C' }
                    },
                    windy: {
                        yesterday: { icon: CloudSun, mainTemp: '14°C', subTemp: '5°C' },
                        today: { icon: Wind, mainTemp: '12°C', subTemp: '2°C', bg: 'https://images.unsplash.com/photo-1476820865390-c52aeebb9891?w=600&q=80' },
                        tomorrow: { icon: Sun, mainTemp: '15°C', subTemp: '4°C' }
                    },
                    dust: {
                        yesterday: { icon: Sun, mainTemp: '15°C', subTemp: '6°C' },
                        today: { icon: Haze, mainTemp: '16°C', subTemp: '5°C', bg: 'https://images.unsplash.com/photo-1545134969-8debd725b733?w=600&q=80' },
                        tomorrow: { icon: CloudSun, mainTemp: '17°C', subTemp: '7°C' }
                    },
                    hot: {
                        yesterday: { icon: Sun, mainTemp: '33°C', subTemp: '25°C' },
                        today: { icon: Sun, mainTemp: '35°C', subTemp: '26°C', bg: 'https://images.unsplash.com/photo-1504370805625-d32c54b16100?w=600&q=80' },
                        tomorrow: { icon: CloudLightning, mainTemp: '34°C', subTemp: '25°C' }
                    }
                };
                return weatherForecasts[type] || weatherForecasts.sunny;
            };

            const currentBgType = weatherType === 'realtime' ? realtimeWeatherType : weatherType;
            const dates = getDates(weatherType);
            const renderData = getRenderWeatherData();
            const MainIcon = renderData.mainIcon;

            useEffect(() => {
                const requestCameraPermission = async () => {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                        setHasCameraPermission(true);
                        // 핵심 포인트: file:// 환경에서 매번 묻는 것을 방지하기 위해 
                        // 카메라 스트림을 바로 끄지 않고 백그라운드에 계속 유지시켜 둡니다.
                        globalStreamRef.current = stream; 
                    } catch (err) {
                        console.error("카메라 권한 거부됨:", err);
                        setHasCameraPermission(false);
                    }
                };
                requestCameraPermission();

                return () => {
                    // 브라우저 탭을 닫거나 앱이 종료될 때만 카메라를 완전히 끕니다.
                    if (globalStreamRef.current) {
                        globalStreamRef.current.getTracks().forEach(track => track.stop());
                    }
                };
            }, []);

            useEffect(() => {
                const loadScript = (src) => {
                    return new Promise((resolve, reject) => {
                        if (document.querySelector(`script[src="${src}"]`)) {
                            resolve();
                            return;
                        }
                        const script = document.createElement('script');
                        script.src = src;
                        script.crossOrigin = 'anonymous';
                        script.onload = resolve;
                        script.onerror = reject;
                        document.body.appendChild(script);
                    });
                };

                const initMediaPipe = async () => {
                    try {
                        await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js');
                        await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js');

                        if (window.SelfieSegmentation && window.Camera) {
                            setIsMediaPipeLoaded(true);
                        } else {
                            console.error("MediaPipe 라이브러리를 로드하지 못했습니다.");
                        }
                    } catch (error) {
                        console.error("스크립트 로드 오류:", error);
                    }
                };

                initMediaPipe();
                return () => {
                    if (cameraRef.current) cameraRef.current.stop();
                    if (selfieSegmentationRef.current) selfieSegmentationRef.current.close();
                };
            }, []);

            const onResults = (results) => {
                if (!canvasRef.current || !results || !results.image || !results.segmentationMask) return;
                const canvasCtx = canvasRef.current.getContext('2d');
                const canvas = canvasRef.current;

                if (results.image.width === 0 || results.image.height === 0) return;

                canvas.width = results.image.width;
                canvas.height = results.image.height;

                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

                canvasCtx.globalCompositeOperation = 'copy';
                canvasCtx.drawImage(results.segmentationMask, 0, 0, canvas.width, canvas.height);

                canvasCtx.globalCompositeOperation = 'source-in';
                canvasCtx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
                canvasCtx.restore();
            };

            const startCameraAndSegmentation = () => {
                if (!isMediaPipeLoaded || !videoRef.current) return;
                videoRef.current.width = 1280;
                videoRef.current.height = 720;

                if (cameraRef.current) {
                    cameraRef.current.start();
                    return;
                }

                selfieSegmentationRef.current = new window.SelfieSegmentation({locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`;
                }});

                selfieSegmentationRef.current.setOptions({ modelSelection: 1 });
                selfieSegmentationRef.current.onResults(onResults);

                cameraRef.current = new window.Camera(videoRef.current, {
                    onFrame: async () => {
                        if (isProcessingRef.current) return;
                        if (videoRef.current && videoRef.current.readyState >= 2 && selfieSegmentationRef.current) {
                            isProcessingRef.current = true;
                            try {
                                await selfieSegmentationRef.current.send({image: videoRef.current});
                            } catch (err) {
                                console.warn("MediaPipe Frame Error (Ignored):", err);
                            } finally {
                                isProcessingRef.current = false;
                            }
                        }
                    },
                    width: 1280,
                    height: 720
                });

                cameraRef.current.start().catch(err => {
                    console.error("카메라 시작 오류:", err);
                });
            };

            const stopCamera = () => {
                if (cameraRef.current) {
                    cameraRef.current.stop();
                    cameraRef.current = null; // 완전히 초기화하여 재시작 시 꼬임 방지
                }
            };

            useEffect(() => {
                // 방송 단계(3~7)에 진입했고, MediaPipe가 로드되었으며, 카메라가 아직 켜지지 않았을 때만 시작
                if (step >= 3 && step <= 7) {
                    if (isMediaPipeLoaded && !cameraRef.current) {
                        startCameraAndSegmentation();
                    }
                } else if (step < 3 || step > 7) {
                    // 방송 단계를 벗어나면 (예: 1단계, 2단계) 카메라 중지
                    stopCamera();
                }
            }, [step, isMediaPipeLoaded]);

            const handleStartBroadcast = () => {
                if (!newsName || !anchorName || !weatherCasterName || citizenNames.some(name => !name)) {
                    alert('모든 정보를 입력해주세요.');
                    return;
                }
                try {
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen().catch(err => {
                            console.warn("전체화면 요청 거부됨:", err);
                        });
                    }
                } catch (e) {
                    console.warn("Fullscreen API 오류", e);
                }
                setStep(2);
            };

            const handleAddCitizen = () => {
                if (citizenNames.length < 3) setCitizenNames([...citizenNames, '']);
            };

            const handleCitizenNameChange = (index, value) => {
                const newNames = [...citizenNames];
                newNames[index] = value;
                setCitizenNames(newNames);
            };

            const handleNext = () => {
                if (step === 2) {
                     setShowTitle(false);
                     setStep(3);
                } else if (step === 5) {
                    if (currentCitizenIndex < citizenNames.length - 1) {
                        setCurrentCitizenIndex(prev => prev + 1);
                    } else {
                        setStep(6);
                    }
                } else if (step === 7) {
                    if (document.fullscreenElement) document.exitFullscreen().catch(console.error);
                    setStep(1);
                    setCurrentCitizenIndex(0);
                } else {
                    setStep(prev => prev + 1);
                }
            };

            useEffect(() => {
                let timer;
                if (step === 2) {
                    timer = setTimeout(() => setShowTitle(true), 3000);
                } else {
                    setShowTitle(false);
                }
                return () => clearTimeout(timer);
            }, [step]);

            return (
                <div className="w-full h-screen font-sans overflow-hidden">
                    <video ref={videoRef} className="hidden" playsInline autoPlay muted></video>

                    {step === 1 && (
                        <div className="min-h-screen bg-gradient-to-br from-blue-50 to-blue-200 flex items-center justify-center p-4">
                            <div className="bg-white p-10 rounded-3xl shadow-2xl max-w-2xl w-full border-4 border-blue-100 relative max-h-screen overflow-y-auto">
                                {!isMediaPipeLoaded && (
                                    <div className="absolute top-2 right-2 text-xs text-red-500 font-bold bg-red-100 p-2 rounded">
                                        시스템 준비 중... (잠시만 기다려주세요)
                                    </div>
                                )}
                                {!hasCameraPermission && (
                                    <div className="absolute top-12 right-2 text-xs text-white font-bold bg-red-500 p-2 rounded">
                                        카메라 접근 권한을 허용해주세요!
                                    </div>
                                )}
                                <h1 className="text-4xl font-extrabold text-blue-600 mb-8 text-center flex items-center justify-center gap-4">
                                    <Video size={40} className="w-10 h-10" /> 날씨 예보 방송 준비
                                </h1>
                                <div className="space-y-6">
                                    <div>
                                        <label className="block text-gray-700 font-bold mb-2">뉴스 이름</label
